name: Update PCSO results
on:
  workflow_dispatch:
  schedule:
    # 10:35 PM Philippines time, after the evening draws are normally published.
    - cron: '35 14 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python scripts/update_results.py
      - name: Commit result changes
        run: |
          if git diff --quiet; then
            echo "No result changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/history.json
          git commit -m "chore: update PCSO lotto results"
          git push
